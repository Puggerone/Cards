workflows:
  android-release:
    name: Android APK Build
    max_build_duration: 90
    environment:
      node: 18.0.0
      java: 17
      groups:
        - default
    scripts:
      - name: Installa dipendenze
        script: npm install

      - name: Expo prebuild
        script: npx expo prebuild --platform android --non-interactive

      - name: Fix AGP 8.1.4 e Gradle 8.3
        script: |
          cd android
          printf 'buildscript {\n    ext {\n        buildToolsVersion = "34.0.0"\n        minSdkVersion = 24\n        compileSdkVersion = 34\n        targetSdkVersion = 34\n        ndkVersion = "26.1.10909125"\n        kotlinVersion = "1.9.23"\n    }\n    repositories {\n        google()\n        mavenCentral()\n        mavenLocal()\n    }\n    dependencies {\n        classpath("com.android.tools.build:gradle:8.1.4")\n        classpath("com.facebook.react:react-native-gradle-plugin")\n        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23")\n    }\n}\n\napply plugin: "com.facebook.react.rootproject"\n' > build.gradle
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties

      - name: Pubblica expo-modules-core in mavenLocal
        script: |
          cd node_modules/expo-modules-core/android
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.3-all.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
          ./gradlew publishToMavenLocal --no-daemon 2>&1 | tail -20 || echo "publishToMavenLocal fallito, continuo"

      - name: Fix settings.gradle
        script: |
          cd android
          sed -i "/includeBuild.*expo-modules-core/d" settings.gradle
          echo "=== settings.gradle ==="
          cat settings.gradle

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - fabcrys@gmail.com
        notify:
          success: true
          failure: true