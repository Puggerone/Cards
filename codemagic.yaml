workflows:
  android-release:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 18.0.0
      java: 17
      vars:
        EXPO_TOKEN: $EXPO_TOKEN
    scripts:
      - name: Installa dipendenze
        script: npm install

      - name: Expo prebuild
        script: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - fabcrys@gmail.com
        notify:
          success: true
          failure: true