workflows:
  android-release:
    name: Android APK Build
    max_build_duration: 60
    environment:
      node: 18.0.0
      java: 17
      groups:
        - default
    scripts:
      - name: Installa dipendenze
        script: npm install

      - name: Expo prebuild
        script: npx expo prebuild --platform android --non-interactive

      - name: Mostra build.gradle generato
        script: |
          echo "=== build.gradle ==="
          cat android/build.gradle
          echo ""
          echo "=== gradle-wrapper.properties ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo ""
          echo "=== settings.gradle ==="
          cat android/settings.gradle

      - name: Fix AGP e Gradle
        script: |
          cd android

          # Riscrivi completamente build.gradle con AGP 8.1.4
          cat > build.gradle << 'GRADLE'
buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.23"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.1.4")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23")
    }
}

apply plugin: "com.facebook.react.rootproject"
GRADLE

          # Fix gradle wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.3-all.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
PROPS

          echo "=== build.gradle dopo fix ==="
          cat build.gradle
          echo "=== gradle wrapper dopo fix ==="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        script: |
          cd android
          ./gradlew assembleRelease --no-daemon -x lint

    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk

    publishing:
      email:
        recipients:
          - fabcrys@gmail.com
        notify:
          success: true
          failure: true